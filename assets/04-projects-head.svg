<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 80" width="960" height="80" role="img" aria-label="Projects section header">
<title>Projects section header</title>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1a2142" stroke-width="1" opacity=".5"/>
  </pattern>
  <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="1" fill="#000" opacity=".12"/>
  </pattern>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0814"/>
    <stop offset="1" stop-color="#05040a"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
    <stop offset="70%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".22"/>
  </radialGradient>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-60" y="-120" width="1080" height="1600">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowL" filterUnits="userSpaceOnUse" x="-80" y="-140" width="1120" height="1640">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowS" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter><clipPath id="win"><path d="M0 0 V0 H960 V80 V80 H0 Z"/></clipPath></defs>
<style>
  text{font-family:'JetBrains Mono','Fira Code',Consolas,'SF Mono','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','NanumGothic','DejaVu Sans Mono','Courier New',monospace;}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}</style>

<g clip-path="url(#win)">
  <rect width="960" height="80" fill="url(#bgGrad)"/>
<rect width="960" height="80" fill="url(#grid)"/>
  <g>
<text x="40" y="44" font-size="12" fill="#8a93b5">04 //</text>
<text x="86" y="44" font-size="15" font-weight="700" fill="#fcee0a" filter="url(#glowS)">PROJECTS</text>
<text x="920" y="44" font-size="11" fill="#8a93b5" text-anchor="end">SELECT A NODE &gt; OPEN REPOSITORY</text>
<path d="M40 56H920" stroke="#00e8ff" stroke-width="1" opacity=".22"/>
<path d="M40 56H172" stroke="#fcee0a" stroke-width="2" filter="url(#glowS)"/>
</g>
  <text x="40" y="74" font-size="11" fill="#3d4666">8 FEATURED REPOSITORIES  //  BACKEND SYSTEMS, QUEUES, CACHES AND AI INTEGRATIONS</text>
  <rect width="960" height="80" fill="url(#scan)" pointer-events="none"/>
<rect width="960" height="80" fill="url(#vignette)" pointer-events="none"/>
</g>
<g fill="none">
<path d="M7 -40V120M953 -40V120" stroke="#00e8ff" stroke-width="1" opacity=".16"/>
<path d="M1 20h10M959 20h-10M1 60h10M959 60h-10" stroke="#fcee0a" stroke-width="1" opacity=".35"/>
<path d="M1 -40V120M959 -40V120" stroke="#00e8ff" stroke-width="2" filter="url(#glow)"/>
</g>
</svg>
