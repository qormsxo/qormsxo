<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="배근태 - Backend Developer, Night City console">
<title>배근태 - Backend Developer, Night City console</title>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1a2142" stroke-width="1" opacity=".5"/>
  </pattern>
  <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="1" fill="#000" opacity=".12"/>
  </pattern>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0814"/>
    <stop offset="1" stop-color="#05040a"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
    <stop offset="70%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".22"/>
  </radialGradient>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-60" y="-120" width="1080" height="1600">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowL" filterUnits="userSpaceOnUse" x="-80" y="-140" width="1120" height="1640">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowS" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="win"><path d="M0 12 Q0 0 12 0 H948 Q960 0 960 12 V320 V320 H0 Z"/></clipPath>
  <radialGradient id="hgA" cx=".18" cy=".12" r=".75"><stop offset="0" stop-color="#00e8ff" stop-opacity=".14"/><stop offset="1" stop-color="#00e8ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="hgB" cx=".88" cy=".9" r=".7"><stop offset="0" stop-color="#ff2d95" stop-opacity=".2"/><stop offset="1" stop-color="#ff2d95" stop-opacity="0"/></radialGradient>
  <linearGradient id="hsweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fcee0a" stop-opacity="0"/><stop offset=".5" stop-color="#fcee0a" stop-opacity="1"/><stop offset="1" stop-color="#fcee0a" stop-opacity="0"/></linearGradient></defs>
<style>
  text{font-family:'JetBrains Mono','Fira Code',Consolas,'SF Mono','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','NanumGothic','DejaVu Sans Mono','Courier New',monospace;}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .gA{animation:gA 6s steps(1) infinite}
  .gB{animation:gB 6s steps(1) infinite}
  @keyframes gA{0%,90%,100%{transform:translate(0,0)}91%{transform:translate(-7px,1px)}93%{transform:translate(5px,-1px)}95%{transform:translate(-2px,2px)}97%{transform:translate(0,0)}}
  @keyframes gB{0%,90%,100%{transform:translate(0,0)}91%{transform:translate(7px,-1px)}93%{transform:translate(-5px,1px)}95%{transform:translate(3px,-2px)}97%{transform:translate(0,0)}}
  .flick{animation:flick 8s steps(1) infinite}
  @keyframes flick{0%,62%,66%,100%{opacity:1}63%{opacity:.45}64%{opacity:1}65%{opacity:.7}}
  .eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.25s ease-in-out infinite}
  .e2{animation-duration:.85s;animation-delay:-.3s}.e3{animation-duration:1.55s;animation-delay:-.7s}
  .e4{animation-duration:1.05s;animation-delay:-.2s}.e5{animation-duration:1.85s;animation-delay:-1s}.e6{animation-duration:1.35s;animation-delay:-.5s}
  @keyframes eq{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}</style>

<g clip-path="url(#win)">
  <rect width="960" height="320" fill="url(#bgGrad)"/>
<rect width="960" height="320" fill="url(#grid)"/>
  <rect width="960" height="320" fill="url(#hgA)"/><rect width="960" height="320" fill="url(#hgB)"/>

  <rect width="960" height="40" fill="#08060f"/>
  <path d="M0 40H960" stroke="#fcee0a" stroke-opacity=".35"/>
  <circle cx="30" cy="20" r="5" fill="#ff2d95"/><circle cx="50" cy="20" r="5" fill="#fcee0a"/><circle cx="70" cy="20" r="5" fill="#3dff9a"/>
  <text x="480" y="25" font-size="12" fill="#8a93b5" text-anchor="middle">배근태@night-city : ~/profile  --  CYBERDECK v2.1</text>
  <circle class="pulse" cx="828" cy="20" r="4" fill="#3dff9a" filter="url(#glowS)"/>
  <text x="926" y="25" font-size="12" fill="#3dff9a" text-anchor="end">ONLINE</text>

  <g font-size="11" fill="#8a93b5">
    <text x="42" y="78">&gt; BOOT SEQUENCE ........ <tspan fill="#3dff9a">OK</tspan></text>
    <text x="42" y="96">&gt; UPLINK ............... <tspan fill="#3dff9a">STABLE</tspan></text>
    <text x="42" y="114">&gt; SECTOR ............... <tspan fill="#00e8ff">BACKEND</tspan></text>
  </g>
  <rect class="eq e1" x="858" y="86" width="5" height="30" fill="#fcee0a" opacity=".85"/><rect class="eq e2" x="867" y="86" width="5" height="30" fill="#ff2d95" opacity=".85"/><rect class="eq e3" x="876" y="86" width="5" height="30" fill="#fcee0a" opacity=".85"/><rect class="eq e4" x="885" y="86" width="5" height="30" fill="#ff2d95" opacity=".85"/><rect class="eq e5" x="894" y="86" width="5" height="30" fill="#fcee0a" opacity=".85"/><rect class="eq e6" x="903" y="86" width="5" height="30" fill="#ff2d95" opacity=".85"/>
  <text x="918" y="132" font-size="10" fill="#3d4666" text-anchor="end">SIGNAL</text>

  <g fill="none" stroke="#00e8ff" stroke-width="1.6" opacity=".85" filter="url(#glowS)">
<path d="M28 160V142H46"/><path d="M914 142H932V160"/>
<path d="M28 252V270H46"/><path d="M914 270H932V252"/>
</g>

  <g font-size="108" font-weight="800" text-anchor="middle">
    <text class="gA" x="480" y="216" fill="#ff2d95" opacity=".8">배<tspan dx="18">근</tspan><tspan dx="18">태</tspan></text>
    <text class="gB" x="480" y="216" fill="#00e8ff" opacity=".8">배<tspan dx="18">근</tspan><tspan dx="18">태</tspan></text>
    <text class="flick" x="480" y="216" fill="#f6fdff" filter="url(#glowL)">배<tspan dx="18">근</tspan><tspan dx="18">태</tspan></text>
  </g>

  <text x="480" y="250" font-size="20" fill="#fcee0a" text-anchor="middle" filter="url(#glowS)">B<tspan dx="5">A</tspan><tspan dx="5">C</tspan><tspan dx="5">K</tspan><tspan dx="5">E</tspan><tspan dx="5">N</tspan><tspan dx="5">D</tspan><tspan dx="5"> </tspan><tspan dx="5">D</tspan><tspan dx="5">E</tspan><tspan dx="5">V</tspan><tspan dx="5">E</tspan><tspan dx="5">L</tspan><tspan dx="5">O</tspan><tspan dx="5">P</tspan><tspan dx="5">E</tspan><tspan dx="5">R</tspan></text>
  <text x="480" y="274" font-size="13" fill="#8a93b5" text-anchor="middle">Java / Spring boot / Node.js / JavaScript / TypeScript / NestJS   //   AI-assisted development &amp; automation</text>

  <rect x="40" y="292" width="880" height="1" fill="#00e8ff" opacity=".22"/>
  <rect x="-200" y="291" width="200" height="3" fill="url(#hsweep)" filter="url(#glowS)">
    <animate attributeName="x" values="-200;960" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text class="blink" x="480" y="310" font-size="11" fill="#8a93b5" text-anchor="middle">[ SCROLL DOWN TO DESCEND INTO THE CITY ]</text>
  <rect width="960" height="320" fill="url(#scan)" pointer-events="none"/>
<rect width="960" height="320" fill="url(#vignette)" pointer-events="none"/>
</g>
<g fill="none">
<path d="M7 -40V360M953 -40V360" stroke="#00e8ff" stroke-width="1" opacity=".16"/>
<path d="M1 20h10M959 20h-10M1 60h10M959 60h-10M1 100h10M959 100h-10M1 140h10M959 140h-10M1 180h10M959 180h-10M1 220h10M959 220h-10M1 260h10M959 260h-10M1 300h10M959 300h-10" stroke="#fcee0a" stroke-width="1" opacity=".35"/>
<path d="M1 12V360M959 12V360M1 12Q1 1 13 1H947Q959 1 959 12" stroke="#00e8ff" stroke-width="2" filter="url(#glow)"/>
</g>
</svg>
