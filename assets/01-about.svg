<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 160" width="960" height="160" role="img" aria-label="Java, Spring Boot, Node.js, TypeScript, NestJS, React. PostgreSQL, Redis, BullMQ. Interested in AI-assisted development and automation.">
<title>Java, Spring Boot, Node.js, TypeScript, NestJS, React. PostgreSQL, Redis, BullMQ. Interested in AI-assisted development and automation.</title>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#e4dccf" stroke-width="1"/>
  </pattern>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="1" height="1" fill="#fff" opacity=".07"/>
  </pattern>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2c2536"/>
    <stop offset="1" stop-color="#241e2e"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
    <stop offset="70%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".22"/>
  </radialGradient>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-60" y="-120" width="1080" height="1600">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowL" filterUnits="userSpaceOnUse" x="-80" y="-140" width="1120" height="1640">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowS" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <clipPath id="win"><path d="M0 0 V0 H960 V160 V160 H0 Z"/></clipPath>
  <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="-200" x2="0" y2="440"><stop offset="0" stop-color="#121c40"/><stop offset="0.2" stop-color="#182448"/><stop offset="0.38" stop-color="#221c44"/><stop offset="0.52" stop-color="#302440"/><stop offset="0.68" stop-color="#3a283c"/><stop offset="0.84" stop-color="#221830"/><stop offset="1" stop-color="#0c0a14"/></linearGradient></defs>
<style>
  text{font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}</style>

<g clip-path="url(#win)">
  <rect width="960" height="160" fill="url(#sky)"/>
  <ellipse cx="720" cy="36" rx="180" ry="20" fill="#e0a8bc" opacity=".08" filter="url(#soft)"/>
  <rect width="960" height="160" filter="url(#grain)" opacity=".4"/>
  <text x="64" y="52" font-size="17" fill="#f3eee6">Java, Spring Boot, Node.js, TypeScript, NestJS, React.</text>
  <text x="64" y="86" font-size="17" fill="#ddd0dc">PostgreSQL, Redis, BullMQ.</text>
  <text x="64" y="128" font-size="17" fill="#f3eee6">Interested in AI-assisted development and automation.</text>
</g>
</svg>
