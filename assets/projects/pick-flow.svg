<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" role="img" aria-label="pick-flow: Real-time recommendation API: clicks and likes become taste vectors in BullMQ workers. A semantic cache skips repeat LLM calls.">
<title>pick-flow: Real-time recommendation API: clicks and likes become taste vectors in BullMQ workers. A semantic cache skips repeat LLM calls.</title><desc>Stack: NestJS, BullMQ, Redis Stack, Gemini</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1a2142" stroke-width="1" opacity=".5"/>
  </pattern>
  <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="1" fill="#000" opacity=".12"/>
  </pattern>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0814"/>
    <stop offset="1" stop-color="#05040a"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
    <stop offset="70%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".22"/>
  </radialGradient>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-60" y="-120" width="1080" height="1600">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowL" filterUnits="userSpaceOnUse" x="-80" y="-140" width="1120" height="1640">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowS" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="win"><path d="M0 0 V0 H480 V200 V200 H0 Z"/></clipPath>
  <clipPath id="pc"><polygon points="10,8 426,8 440,22 440,192 24,192 10,178"/></clipPath>
  <linearGradient id="cs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2d95" stop-opacity="0"/><stop offset=".5" stop-color="#ff2d95" stop-opacity=".16"/><stop offset="1" stop-color="#ff2d95" stop-opacity="0"/></linearGradient></defs>
<style>
  text{font-family:'JetBrains Mono','Fira Code',Consolas,'SF Mono','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','NanumGothic','DejaVu Sans Mono','Courier New',monospace;}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}</style>

<g clip-path="url(#win)">
  <rect width="480" height="200" fill="url(#bgGrad)"/>
<rect width="480" height="200" fill="url(#grid)"/>
  <polygon points="10,8 426,8 440,22 440,192 24,192 10,178" fill="#0c0e1a" fill-opacity=".92" stroke="#ff2d95" stroke-opacity=".55"/>
  <g clip-path="url(#pc)"><rect x="10" y="-32" width="430" height="40" fill="url(#cs)">
    <animate attributeName="y" values="-32;192" dur="5.5s" begin="0.9s" repeatCount="indefinite"/>
  </rect></g>
  <rect x="10" y="22" width="3" height="156" fill="#ff2d95" filter="url(#glowS)"/>
  <text x="30" y="41" font-size="11" fill="#8a93b5">PRJ-02 <tspan fill="#ff2d95">[AI x BACKEND]</tspan></text>
  <text x="422" y="41" font-size="11" fill="#ff2d95" text-anchor="end">OPEN &gt;</text>
  <text x="30" y="76" font-size="21" font-weight="700" fill="#f2fdff" filter="url(#glowS)">pick-flow</text>
  <text x="30" y="106" font-size="12.5" fill="#b7c9e8">Real-time recommendation API: clicks and likes</text><text x="30" y="124" font-size="12.5" fill="#b7c9e8">become taste vectors in BullMQ workers.</text><text x="30" y="142" font-size="12.5" fill="#b7c9e8">A semantic cache skips repeat LLM calls.</text>
  <g><rect x="30" y="150" width="60" height="22" rx="2" fill="#ff2d95" fill-opacity=".08" stroke="#ff2d95" stroke-opacity=".55"/><text x="60" y="164.85" font-size="11" fill="#ff2d95" text-anchor="middle">NestJS</text></g><g><rect x="98" y="150" width="60" height="22" rx="2" fill="#ff2d95" fill-opacity=".08" stroke="#ff2d95" stroke-opacity=".55"/><text x="128" y="164.85" font-size="11" fill="#ff2d95" text-anchor="middle">BullMQ</text></g><g><rect x="166" y="150" width="93" height="22" rx="2" fill="#ff2d95" fill-opacity=".08" stroke="#ff2d95" stroke-opacity=".55"/><text x="212.5" y="164.85" font-size="11" fill="#ff2d95" text-anchor="middle">Redis Stack</text></g><g><rect x="267" y="150" width="60" height="22" rx="2" fill="#ff2d95" fill-opacity=".08" stroke="#ff2d95" stroke-opacity=".55"/><text x="297" y="164.85" font-size="11" fill="#ff2d95" text-anchor="middle">Gemini</text></g>
  <rect width="480" height="200" fill="url(#scan)" pointer-events="none"/>
<rect width="480" height="200" fill="url(#vignette)" pointer-events="none"/>
</g>
<g fill="none">
<path d="M473 -40V240" stroke="#00e8ff" stroke-width="1" opacity=".16"/>
<path d="M479 20h-10M479 60h-10M479 100h-10M479 140h-10M479 180h-10" stroke="#fcee0a" stroke-width="1" opacity=".35"/>
<path d="M479 -40V240" stroke="#00e8ff" stroke-width="2" filter="url(#glow)"/>
</g>
</svg>
