<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="qormsxo profile auto-update pipeline: GitHub Actions cron, fetch, render, commit. Last sync 2026-10-04">
<title>qormsxo profile auto-update pipeline: GitHub Actions cron, fetch, render, commit. Last sync 2026-10-04</title>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1a2142" stroke-width="1" opacity=".5"/>
  </pattern>
  <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="1" fill="#000" opacity=".12"/>
  </pattern>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0814"/>
    <stop offset="1" stop-color="#05040a"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
    <stop offset="70%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".22"/>
  </radialGradient>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-60" y="-120" width="1080" height="1600">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowL" filterUnits="userSpaceOnUse" x="-80" y="-140" width="1120" height="1640">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowS" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter><clipPath id="win"><path d="M0 0 V0 H960 V228 Q960 240 948 240 H12 Q0 240 0 228 Z"/></clipPath></defs>
<style>
  text{font-family:'JetBrains Mono','Fira Code',Consolas,'SF Mono','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','NanumGothic','DejaVu Sans Mono','Courier New',monospace;}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}.flow{animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}</style>

<g clip-path="url(#win)">
  <rect width="960" height="240" fill="url(#bgGrad)"/>
<rect width="960" height="240" fill="url(#grid)"/>
  <g>
<text x="40" y="40" font-size="12" fill="#8a93b5">06 //</text>
<text x="86" y="40" font-size="15" font-weight="700" fill="#fcee0a" filter="url(#glowS)">AUTO_UPDATE</text>
<text x="920" y="40" font-size="11" fill="#8a93b5" text-anchor="end">LAST SYNC 2026-10-04  //  SOURCE GRAPHQL</text>
<path d="M40 52H920" stroke="#00e8ff" stroke-width="1" opacity=".22"/>
<path d="M40 52H172" stroke="#fcee0a" stroke-width="2" filter="url(#glowS)"/>
</g>
  <polygon points="40,74 220,74 230,84 230,130 50,130 40,120" fill="#0c0e1a" fill-opacity=".9" stroke="#00e8ff" stroke-opacity=".55"/><text x="135" y="98" font-size="13" font-weight="700" fill="#00e8ff" text-anchor="middle">GITHUB ACTIONS</text><text x="135" y="116" font-size="11" fill="#8a93b5" text-anchor="middle">daily cron 15:17 UTC</text><path class="flow" d="M236 102H264" stroke="#ff2d95" stroke-width="2" stroke-dasharray="6 4" filter="url(#glowS)"/><path d="M260 97l6 5l-6 5" fill="none" stroke="#ff2d95" stroke-width="2"/><polygon points="270,74 450,74 460,84 460,130 280,130 270,120" fill="#0c0e1a" fill-opacity=".9" stroke="#00e8ff" stroke-opacity=".55"/><text x="365" y="98" font-size="13" font-weight="700" fill="#00e8ff" text-anchor="middle">fetch.mjs</text><text x="365" y="116" font-size="11" fill="#8a93b5" text-anchor="middle">GraphQL contributions</text><path class="flow" d="M466 102H494" stroke="#ff2d95" stroke-width="2" stroke-dasharray="6 4" filter="url(#glowS)"/><path d="M490 97l6 5l-6 5" fill="none" stroke="#ff2d95" stroke-width="2"/><polygon points="500,74 680,74 690,84 690,130 510,130 500,120" fill="#0c0e1a" fill-opacity=".9" stroke="#00e8ff" stroke-opacity=".55"/><text x="595" y="98" font-size="13" font-weight="700" fill="#00e8ff" text-anchor="middle">render.mjs</text><text x="595" y="116" font-size="11" fill="#8a93b5" text-anchor="middle">SVG city + HUD</text><path class="flow" d="M696 102H724" stroke="#ff2d95" stroke-width="2" stroke-dasharray="6 4" filter="url(#glowS)"/><path d="M720 97l6 5l-6 5" fill="none" stroke="#ff2d95" stroke-width="2"/><polygon points="730,74 910,74 920,84 920,130 740,130 730,120" fill="#0c0e1a" fill-opacity=".9" stroke="#00e8ff" stroke-opacity=".55"/><text x="825" y="98" font-size="13" font-weight="700" fill="#00e8ff" text-anchor="middle">git commit</text><text x="825" y="116" font-size="11" fill="#8a93b5" text-anchor="middle">only if changed</text>
  <text x="40" y="160" font-size="11" fill="#8a93b5">AUTH: GITHUB_TOKEN / optional PROFILE_TOKEN repository secret  --  no credentials are stored in this repo</text>
  <text x="40" y="196" font-size="14" fill="#3dff9a">$ <tspan fill="#eaf4ff">exit</tspan></text>
  <text x="40" y="216" font-size="12" fill="#8a93b5">connection to night-city closed. // EOF <tspan class="blink" fill="#fcee0a">_</tspan></text>
  <rect width="960" height="240" fill="url(#scan)" pointer-events="none"/>
<rect width="960" height="240" fill="url(#vignette)" pointer-events="none"/>
</g>
<g fill="none">
<path d="M7 -40V280M953 -40V280" stroke="#00e8ff" stroke-width="1" opacity=".16"/>
<path d="M1 20h10M959 20h-10M1 60h10M959 60h-10M1 100h10M959 100h-10M1 140h10M959 140h-10M1 180h10M959 180h-10M1 220h10M959 220h-10" stroke="#fcee0a" stroke-width="1" opacity=".35"/>
<path d="M1 -40V228M959 -40V228M1 228Q1 239 13 239H947Q959 239 959 228" stroke="#00e8ff" stroke-width="2" filter="url(#glow)"/>
</g>
</svg>
