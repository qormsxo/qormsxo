t x="480.5" y="198.55" font-size="13" fill="#ff2d95" text-anchor="middle">GitHub Actions</text></g><g><rect x="555" y="182" width="43" height="24" rx="2" fill="#ff2d95" fill-opacity=".08" stroke="#ff2d95" stroke-opacity=".55"/><text x="576.5" y="198.55" font-size="13" fill="#ff2d95" text-anchor="middle">SSE</text></g><text x="40" y="236" font-size="11" fill="#8a93b5">TOOLING</text><path d="M40 246H920" stroke="#00e8ff" stroke-opacity=".08"/><g><rect x="200" y="220" width="75" height="24" rx="2" fill="#00e8ff" fill-opacity=".08" stroke="#00e8ff" stroke-opacity=".55"/><text x="237.5" y="236.55" font-size="13" fill="#00e8ff" text-anchor="middle">TypeORM</text></g><g><rect x="285" y="220" width="67" height="24" rx="2" fill="#00e8ff" fill-opacity=".08" stroke="#00e8ff" stroke-opacity=".55"/><text x="318.5" y="236.55" font-size="13" fill="#00e8ff" text-anchor="middle">Prisma</text></g><g><rect x="362" y="220" width="67" height="24" rx="2" fill="#00e8ff" fill-opacity=".08" stroke="#00e8ff" stroke-opacity=".55"/><text x="395.5" y="236.55" font-size="13" fill="#00e8ff" text-anchor="middle">Docker</text></g><g><rect x="439" y="220" width="75" height="24" rx="2" fill="#00e8ff" fill-opacity=".08" stroke="#00e8ff" stroke-opacity=".55"/><text x="476.5" y="236.55" font-size="13" fill="#00e8ff" text-anchor="middle">Swagger</text></g><g><rect x="524" y="220" width="51" height="24" rx="2" fill="#00e8ff" fill-opacity=".08" stroke="#00e8ff" stroke-opacity=".55"/><text x="549.5" y="236.55" font-size="13" fill="#00e8ff" text-anchor="middle">Jest</text></g><g><rect x="585" y="220" width="36" height="24" rx="2" fill="#00e8ff" fill-opacity=".08" stroke="#00e8ff" stroke-opacity=".55"/><text x="603" y="236.55" font-size="13" fill="#00e8ff" text-anchor="middle">k6</text></g>
  <text x="40" y="266" font-size="11" fill="#3d4666">// listed: original README badges + what the featured projects actually use.</text>
